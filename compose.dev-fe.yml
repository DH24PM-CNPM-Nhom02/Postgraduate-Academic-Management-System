services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: auth_db
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pams-network

  api-gateway:
    image: ${IMAGE_PREFIX}-backend-api-gateway:${IMAGE_TAG}
    env_file:
      - .env
    environment:
      PORT: 8080
    ports:
      - "3001:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

  auth-service:
    image: ${IMAGE_PREFIX}-backend-auth-service:${IMAGE_TAG}
    env_file:
      - .env
    environment:
      PORT: 8080
      AUTH_DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/auth_db
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

  phd-service:
    image: ${IMAGE_PREFIX}-backend-phd-service:${IMAGE_TAG}
    environment:
      PORT: 8080
      PHD_DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/phd_db
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

  document-service:
    image: ${IMAGE_PREFIX}-backend-document-service:${IMAGE_TAG}
    environment:
      PORT: 8080
      DOCUMENT_DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/document_db
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

  notification-service:
    image: ${IMAGE_PREFIX}-backend-notification-service:${IMAGE_TAG}
    environment:
      PORT: 8080
      NOTIFICATION_DATABASE_URL: mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb:3306/notification_db
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

networks:
  pams-network:
    driver: bridge

volumes:
  mariadb_data:

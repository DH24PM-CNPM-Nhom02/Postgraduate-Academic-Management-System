services:
  frontend:
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./frontend/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${API_GATEWAY_HOST_PORT:-8080}/api/v1
      - AUTH_SECRET=pams-dev-auth-secret-change-before-sharing
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

volumes:
  frontend_node_modules:
  frontend_next:

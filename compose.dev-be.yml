services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-pams_dev_root_password}
      MARIADB_DATABASE: auth_db
      MARIADB_USER: pams_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-pams_dev_password}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pams-network

  api-gateway:
    build:
      context: ./backend
      args:
        APP_NAME: api-gateway
    environment:
      API_GATEWAY_PORT: 8080
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      DOCUMENT_SERVICE_HOST: document-service
      DOCUMENT_SERVICE_PORT: 3002
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 3003
      PHD_SERVICE_HOST: phd-service
      PHD_SERVICE_PORT: 3004
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-pams-dev-access-secret-change-before-sharing}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-pams-dev-refresh-secret-change-before-sharing}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
    ports:
      - "${API_GATEWAY_HOST_PORT:-3001}:8080"
    depends_on:
      - auth-service
      - document-service
      - notification-service
      - phd-service
    networks:
      - pams-network

  auth-service:
    build:
      context: ./backend
      args:
        APP_NAME: auth-service
    environment:
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: 3001
      AUTH_DATABASE_URL: mysql://pams_user:${MARIADB_PASSWORD:-pams_dev_password}@mariadb:3306/auth_db
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-pams-dev-access-secret-change-before-sharing}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-pams-dev-refresh-secret-change-before-sharing}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

  document-service:
    build:
      context: ./backend
      args:
        APP_NAME: document-service
    environment:
      DOCUMENT_SERVICE_HOST: 0.0.0.0
      DOCUMENT_SERVICE_PORT: 3002
      DOCUMENT_DATABASE_URL: mysql://pams_user:${MARIADB_PASSWORD:-pams_dev_password}@mariadb:3306/document_db
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

  notification-service:
    build:
      context: ./backend
      args:
        APP_NAME: notification-service
    environment:
      NOTIFICATION_SERVICE_HOST: 0.0.0.0
      NOTIFICATION_SERVICE_PORT: 3003
      NOTIFICATION_DATABASE_URL: mysql://pams_user:${MARIADB_PASSWORD:-pams_dev_password}@mariadb:3306/notification_db
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

  phd-service:
    build:
      context: ./backend
      args:
        APP_NAME: phd-service
    environment:
      PHD_SERVICE_HOST: 0.0.0.0
      PHD_SERVICE_PORT: 3004
      PHD_DATABASE_URL: mysql://pams_user:${MARIADB_PASSWORD:-pams_dev_password}@mariadb:3306/phd_db
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

networks:
  pams-network:
    driver: bridge

volumes:
  mariadb_data:

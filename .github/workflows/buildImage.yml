name: Build Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    # chỉ build khi CI xanh, do push lên main (tag v* và PR bị loại)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service, target: runtime, app_name: auth-service }
          - { name: phd-service, target: runtime, app_name: phd-service }
          - {
              name: document-service,
              target: runtime,
              app_name: document-service,
            }
          - {
              name: notification-service,
              target: runtime,
              app_name: notification-service,
            }
          - { name: db-init, target: db-init, app_name: db-init }

    steps:
      - name: Checkout đúng commit của CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: ${{ matrix.target }}
          build-args: APP_NAME=${{ matrix.app_name }}
          push: true
          tags: |
            ghcr.io/dh24pm-cnpm-nhom02/postgraduate-academic-management-system-backend-${{ matrix.name }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/dh24pm-cnpm-nhom02/postgraduate-academic-management-system-backend-${{ matrix.name }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

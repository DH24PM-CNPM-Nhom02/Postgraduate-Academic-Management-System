name: CD

on:
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_db_init:
        description: "Chạy db-init (prisma db push + seed) sau khi deploy"
        type: boolean
        default: false

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ---------- Mở port 22 tạm thời cho IP của runner ----------
      - name: Lấy IP public của runner
        id: ip
        run: |
          IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Cấu hình AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Mở port 22 cho IP runner
        id: open_sg
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.ip }}/32"
          sleep 10

      # ---------- Deploy ----------
      - name: Copy docker-compose.prod.yml lên EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: backend/docker-compose.prod.yml
          target: /opt/pams/backend
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || 'latest' }}
          RUN_DB_INIT: ${{ inputs.run_db_init && 'true' || 'false' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG,RUN_DB_INIT
          script_stop: true
          script: |
            set -e
            cd /opt/pams/backend

            COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            $COMPOSE pull
            $COMPOSE up -d --remove-orphans

            if [ "$RUN_DB_INIT" = "true" ]; then
              $COMPOSE --profile init pull db-init
              $COMPOSE --profile init run --rm db-init
            fi

            # đợi rồi kiểm tra đủ 4 service đang chạy
            sleep 15
            $COMPOSE ps
            test "$($COMPOSE ps --status running -q | wc -l)" -ge 4

            docker image prune -a -f
            docker logout ghcr.io

      # ---------- Đóng port 22 (luôn chạy, kể cả khi deploy fail) ----------
      - name: Đóng port 22
        if: ${{ always() && steps.open_sg.outcome == 'success' }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.ip }}/32"

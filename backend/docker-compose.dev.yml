name: pams-be

# Chạy backend:
# docker compose -f backend/docker-compose.dev.yml up --build

x-jwt-env: &jwt-env
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES}

x-backend-build: &backend-build
  context: .
  target: dev

x-backend-src: &backend-src
  - ./apps:/app/apps
  - ./lib:/app/lib

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: pams_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pams-network

  api-gateway:
    build:
      <<: *backend-build
      args:
        APP_NAME: api-gateway
    volumes: *backend-src
    environment:
      <<: *jwt-env
      API_GATEWAY_PORT: 8080
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      DOCUMENT_SERVICE_HOST: document-service
      DOCUMENT_SERVICE_PORT: 3002
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 3003
      PHD_SERVICE_HOST: phd-service
      PHD_SERVICE_PORT: 3004
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_GATEWAY_PORT}:8080"
    depends_on:
      - auth-service
      - document-service
      - notification-service
      - phd-service
    networks:
      - pams-network

  auth-service:
    build:
      <<: *backend-build
      args:
        APP_NAME: auth-service
    volumes: *backend-src
    environment:
      <<: *jwt-env
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: 3001
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      AUTH_DATABASE_URL: mysql://pams_user:${MARIADB_PASSWORD}@mariadb:3306/auth_db
      NOTIFICATION_HOST: notification-service
      NOTIFICATION_PORT: 3003
    depends_on:
      mariadb:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - pams-network

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-4.48}
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=100
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEED_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${SEAWEED_S3_SECRET_KEY}
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    networks:
      - pams-network

  document-service:
    build:
      <<: *backend-build
      args:
        APP_NAME: document-service
    volumes: *backend-src
    environment:
      DOCUMENT_SERVICE_HOST: 0.0.0.0
      DOCUMENT_SERVICE_PORT: 3002
      DOCUMENT_DATABASE_URL: mysql://pams_user:${MARIADB_PASSWORD}@mariadb:3306/document_db
      SEAWEED_S3_ENDPOINT: http://seaweedfs:8333
      SEAWEED_S3_REGION: us-east-1
      SEAWEED_S3_BUCKET: pams-documents
      SEAWEED_S3_ACCESS_KEY: ${SEAWEED_S3_ACCESS_KEY}
      SEAWEED_S3_SECRET_KEY: ${SEAWEED_S3_SECRET_KEY}
    depends_on:
      seaweedfs:
        condition: service_started
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

  notification-service:
    build:
      <<: *backend-build
      args:
        APP_NAME: notification-service
    volumes: *backend-src
    environment:
      NOTIFICATION_SERVICE_HOST: 0.0.0.0
      NOTIFICATION_SERVICE_PORT: 3003
      NOTIFICATION_DATABASE_URL: mysql://pams_user:${MARIADB_PASSWORD}@mariadb:3306/notification_db
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - pams-network

  phd-service:
    build:
      <<: *backend-build
      args:
        APP_NAME: phd-service
    volumes: *backend-src
    environment:
      PHD_SERVICE_HOST: 0.0.0.0
      PHD_SERVICE_PORT: 3004
      PHD_DATABASE_URL: mysql://pams_user:${MARIADB_PASSWORD}@mariadb:3306/phd_db
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      DOCUMENT_SERVICE_HOST: document-service
      DOCUMENT_SERVICE_PORT: 3002
      NOTIFICATION_HOST: notification-service
      NOTIFICATION_PORT: 3003
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 3003
    depends_on:
      mariadb:
        condition: service_healthy
      auth-service:
        condition: service_started
      notification-service:
        condition: service_started
      document-service:
        condition: service_started
    networks:
      - pams-network

networks:
  pams-network:
    name: pams-network
    driver: bridge

volumes:
  seaweedfs_data:
  mariadb_data:
